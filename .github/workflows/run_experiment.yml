name: Run Experiment Task

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "MAS architecture"
        required: true
        type: choice
        options: [pipeline, broadcast, supervisor_as_tools]
      project:
        description: "Baseline project"
        required: true
        type: choice
        options: [calculator, TODO, github-workflow-manager]
      task_num:
        description: "Task number"
        required: true
        type: choice
        options: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10"]
      strategy:
        description: "Prompt strategy (leave blank to run all three)"
        required: false
        type: choice
        options: ["all", "structured_text", "few_shot", "test_driven"]
        default: "all"

jobs:
  few-shot:
    if: ${{ inputs.strategy == 'all' || inputs.strategy == 'few_shot' }}
    uses: ./.github/workflows/claude-implement-shared.yml
    with:
      architecture: ${{ inputs.architecture }}
      strategy: few_shot
      project: ${{ inputs.project }}
      task_num: ${{ inputs.task_num }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  structured-text:
    if: ${{ inputs.strategy == 'all' || inputs.strategy == 'structured_text' }}
    uses: ./.github/workflows/claude-implement-shared.yml
    with:
      architecture: ${{ inputs.architecture }}
      strategy: structured_text
      project: ${{ inputs.project }}
      task_num: ${{ inputs.task_num }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  test-driven:
    if: ${{ inputs.strategy == 'all' || inputs.strategy == 'test_driven' }}
    uses: ./.github/workflows/claude-implement-shared.yml
    with:
      architecture: ${{ inputs.architecture }}
      strategy: test_driven
      project: ${{ inputs.project }}
      task_num: ${{ inputs.task_num }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
