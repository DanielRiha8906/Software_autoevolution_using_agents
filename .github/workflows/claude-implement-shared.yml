name: Claude Implement Task (shared)

on:
  workflow_call:
    inputs:
      architecture:
        description: "MAS architecture (pipeline, broadcast, supervisor_as_tools)"
        type: string
        required: true
      strategy:
        description: "Task specification strategy (user_stories, structured_text, test_driven)"
        type: string
        required: true
      project:
        description: "Baseline project (calculator, TODO, github-workflow-manager)"
        type: string
        required: true
      task_num:
        description: "Task number (01–10)"
        type: string
        required: true
    secrets:
      anthropic_api_key:
        required: true

jobs:
  claude-implement:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare prompts
        id: prompts
        shell: bash
        run: |
          TASK_DIR=$(ls -d "prompts/strategies/${{ inputs.strategy }}/${{ inputs.project }}/${{ inputs.task_num }}_"* 2>/dev/null | head -1)

          if [ -z "$TASK_DIR" ]; then
            echo "Task directory not found for ${{ inputs.task_num }}"
            exit 1
          fi

          TASK_PROMPT=$(cat "$TASK_DIR/prompt.txt")

          if [ -z "$TASK_PROMPT" ]; then
            echo "Task prompt is empty"
            exit 1
          fi

          {
            echo "task_prompt<<EOF"
            echo "$TASK_PROMPT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          case "${{ inputs.architecture }}" in
            pipeline)
              ARCH="Architecture: PIPELINE
          Use the Agent tool to run a strict sequential multi-agent pipeline.
          Each sub-agent receives the output of the previous one. Do not write implementation code yourself.

          CONTEXT TO PASS TO EVERY SUB-AGENT:
          - Working directory: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/
          - Edit ONLY src/ and tests/ inside that directory (UML Designer: artifacts/ only)
          - NEVER read or write anything under baseline/
          - NEVER create files outside your working directory
          - Use artifacts/*.puml as a RAG index to understand the codebase structure before reading any source files — the diagrams describe classes, components, and flows

          1. Spawn a Data Analyst sub-agent.
             Goal: read src/ and the task, identify exactly what needs to change.
             Output: write findings to analysis.md in the working directory.

          2. Spawn a System Architect sub-agent.
             Input: read analysis.md.
             Goal: design the implementation — which classes, methods, and files to add or change.
             Output: write a concrete design plan to design.md.

          3. Spawn a Programmer sub-agent.
             Input: read design.md.
             Goal: implement the design in src/ only. Do not write tests.
             Output: list of new or changed functions/classes and which need test coverage.

          4. Spawn a pytest-tester sub-agent, passing the Programmer's output (new/changed functions and classes).
             Goal: write tests in tests/ for the reported code and run the full suite.
             If tests reveal production bugs, spawn the Programmer sub-agent with the full failure report so it can fix src/.
             Repeat (tester → programmer → tester) up to 3 cycles.

          5. Spawn a UML Designer sub-agent.
             Goal: update artifacts/*.puml to reflect the current state of src/ after all changes."
              ;;
            broadcast)
              ARCH="Architecture: BROADCAST
          Use the Agent tool to spawn 3 independent Implementer sub-agents on separate branches,
          then evaluate and apply the best result. Do not write implementation code yourself.

          AVAILABLE AGENTS: You may optionally spawn a Data Analyst and/or System Architect
          sub-agent before the fan-out if you judge the task complex enough to warrant it.
          This is not required — use your judgement.

          ISOLATION RULE: Each implementer must work on its own branch. Before any sub-agent
          reads or writes a single file, it must run:
            git checkout -b broadcast-candidate-<letter>
          If it skips this step, its work is invalid.

          CONTEXT TO PASS TO EVERY IMPLEMENTER SUB-AGENT:
          - Working directory: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/
          - Edit ONLY src/ and tests/ inside that directory
          - NEVER read or write anything under baseline/ — it is a protected reference copy
          - NEVER create files outside your working directory
          - The repo root is NOT your working directory

          1. Spawn Implementer-A sub-agent with this exact context:
             - First command: git checkout -b broadcast-candidate-a
             - Working directory: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/
             - Edit ONLY src/ and tests/ inside that directory. NEVER touch baseline/.
             - Implement the task independently.

          2. git checkout <task-branch>, then spawn Implementer-B with this exact context:
             - First command: git checkout -b broadcast-candidate-b
             - Working directory: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/
             - Edit ONLY src/ and tests/ inside that directory. NEVER touch baseline/.
             - Implement the task independently. Do not read candidate-a's work.

          3. git checkout <task-branch>, then spawn Implementer-C with this exact context:
             - First command: git checkout -b broadcast-candidate-c
             - Working directory: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/
             - Edit ONLY src/ and tests/ inside that directory. NEVER touch baseline/.
             - Implement the task independently. Do not read candidate-a or candidate-b's work.

          4. For each candidate branch: git checkout broadcast-candidate-<letter>, run pytest, record pass count.

          5. git checkout <task-branch>. Copy src/ and tests/ from the candidate with the most
             tests passing into the working directory.

          6. In progress.md document all 3 candidates (approach taken, test score) and
             explain why you selected the winner.

          7. Spawn a UML Designer sub-agent.
             Goal: update artifacts/*.puml to reflect the current state of src/ after all changes."
              ;;
            supervisor_as_tools)
              ARCH="Architecture: SUPERVISOR-AS-TOOLS
          You are a supervisor. Use the Agent tool to delegate work to specialized sub-agents.
          You decide what to delegate, when, and in what order — you are not bound to a fixed sequence.
          Do not write implementation code yourself.

          CONTEXT TO PASS TO EVERY SUB-AGENT:
          - Working directory: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/
          - Edit ONLY src/ and tests/ inside that directory (UML Designer: artifacts/ only)
          - NEVER read or write anything under baseline/
          - NEVER create files outside your working directory
          - Use artifacts/*.puml as a RAG index to understand the codebase structure before reading any source files — the diagrams describe classes, components, and flows

          Available sub-agent roles you may spawn (use as needed):
          - Analyst: reads codebase, produces an analysis report
          - Architect: designs the implementation approach
          - Programmer: implements code changes in src/ and tests/
          - Tester: runs pytest and reports what passes or fails
          - UML Designer: updates artifacts/*.puml to reflect the current state of src/

          Coordinate until all tests pass and diagrams are up to date. You may spawn the same role more than once."
              ;;
            *)
              echo "Unknown architecture: ${{ inputs.architecture }}"
              exit 1
              ;;
          esac

          {
            echo "arch_prompt<<EOF"
            echo "$ARCH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          case "${{ inputs.strategy }}" in
            user_stories)
              STRAT="Task format: USER STORIES — the task is described as user stories (As a…, I want…, So that…) with acceptance criteria. Implement everything needed to satisfy all acceptance criteria."
              ;;
            structured_text)
              STRAT="Task format: STRUCTURED TEXT (MoSCoW) — Must/Should/Could/Won't. Implement all Must items. Implement Should items if straightforward."
              ;;
            test_driven)
              STRAT="Task format: TEST-DRIVEN — failing tests define the requirement. Your goal is to make all specified tests pass."
              ;;
            *)
              echo "Unknown strategy: ${{ inputs.strategy }}"
              exit 1
              ;;
          esac

          {
            echo "strategy_prompt<<EOF"
            echo "$STRAT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Action
        id: run-claude
        uses: anthropics/claude-code-action@v1
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: "--model claude-haiku-4-5-20251001 --max-turns 100 --dangerously-skip-permissions"
          prompt: |
            You are the autoevolution agent for:
            Architecture: ${{ inputs.architecture }} | Strategy: ${{ inputs.strategy }} | Project: ${{ inputs.project }}

            Your working directory:
            experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/

            Write ONLY inside this directory.
            Never modify baseline/ or any other experiment directory.
            You may read repository-level configuration files such as CLAUDE.md, pyproject.toml, pytest.ini, requirements files, and README files when necessary.

            ${{ steps.prompts.outputs.arch_prompt }}

            ${{ steps.prompts.outputs.strategy_prompt }}

            Task ${{ inputs.task_num }}:
            ${{ steps.prompts.outputs.task_prompt }}

            Steps:
            1. Create a branch named exactly:
               task/${{ inputs.architecture }}-${{ inputs.strategy }}-${{ inputs.project }}-${{ inputs.task_num }}

            2. Implement the task inside:
               experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/

            3. Run:
               pytest experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/tests/ -q

               If tests fail, fix and re-run. Maximum 3 attempts.

            4. Update artifacts/*.puml inside the working directory to reflect the current state of src/ after your changes.
               All diagrams must be valid PlantUML files using @startuml and @enduml.
               Only update diagrams that changed.

            5. Append a summary to:
               experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/progress.md

               Include:
               - task number
               - files changed
               - test result

               Add this exact line. Do not fill in values:
               Duration: PENDING | Cost: PENDING | Turns: PENDING

            6. Commit all changes and open a PR targeting main with title:
               task ${{ inputs.task_num }} | ${{ inputs.architecture }} / ${{ inputs.strategy }} / ${{ inputs.project }}

            Hard constraints:
            - Never push directly to main
            - Never modify files outside your working directory
            - Follow CLAUDE.md strictly

      - name: Upload execution log
        if: always() && steps.run-claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: execution-${{ inputs.architecture }}-${{ inputs.strategy }}-${{ inputs.project }}-task${{ inputs.task_num }}
          path: ${{ steps.run-claude.outputs.execution_file }}

      - name: Log cost and turns
        if: always()
        shell: bash
        run: |
          EXEC_FILE="${{ steps.run-claude.outputs.execution_file }}"

          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            echo "No execution file found, skipping."
            exit 0
          fi

          RESULT=$(jq '.[] | select(.type == "result")' "$EXEC_FILE")
          COST=$(echo "$RESULT" | jq -r '.total_cost_usd // "N/A"')
          TURNS=$(echo "$RESULT" | jq -r '.num_turns // "N/A"')
          DURATION=$(echo "$RESULT" | jq -r '.duration_ms // 0')
          SUBTYPE=$(echo "$RESULT" | jq -r '.subtype // "unknown"')
          DURATION_S=$(echo "scale=1; $DURATION / 1000" | bc)

          echo "## Claude Run Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Result | $SUBTYPE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Total cost | \$$COST USD |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Turns | $TURNS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duration | ${DURATION_S}s |" >> "$GITHUB_STEP_SUMMARY"

      - name: Patch progress.md with actual cost
        if: always()
        shell: bash
        env:
          PROGRESS_FILE: experiments/${{ inputs.architecture }}/${{ inputs.strategy }}/${{ inputs.project }}/progress.md
          BRANCH: task/${{ inputs.architecture }}-${{ inputs.strategy }}-${{ inputs.project }}-${{ inputs.task_num }}
        run: |
          EXEC_FILE="${{ steps.run-claude.outputs.execution_file }}"

          if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ]; then
            exit 0
          fi

          RESULT=$(jq '.[] | select(.type == "result")' "$EXEC_FILE")
          COST=$(echo "$RESULT" | jq -r '.total_cost_usd // "N/A"')
          TURNS=$(echo "$RESULT" | jq -r '.num_turns // "N/A"')
          DURATION=$(echo "$RESULT" | jq -r '.duration_ms // 0')
          DURATION_S=$(echo "scale=1; $DURATION / 1000" | bc)

          if [ "$COST" != "N/A" ]; then
            COST_FMT=$(printf "%.6f" "$COST" 2>/dev/null || echo "$COST")
          else
            COST_FMT="$COST"
          fi

          git fetch --all --quiet

          if ! git branch -r | grep -q "origin/$BRANCH"; then
            echo "Branch origin/$BRANCH not found. Skipping progress patch."
            exit 0
          fi

          git checkout -b "$BRANCH" "origin/$BRANCH" 2>/dev/null || git checkout "$BRANCH"

          if [ ! -f "$PROGRESS_FILE" ]; then
            echo "Progress file not found. Skipping."
            exit 0
          fi

          if ! grep -q "Duration: PENDING | Cost: PENDING | Turns: PENDING" "$PROGRESS_FILE"; then
            echo "No pending metrics line found. Skipping."
            exit 0
          fi

          export ACTUAL_LINE="Duration: ${DURATION_S}s | Cost: \$${COST_FMT} USD | Turns: ${TURNS}"

          python3 -c "import os; f=os.environ['PROGRESS_FILE']; content=open(f).read(); content=content.replace('Duration: PENDING | Cost: PENDING | Turns: PENDING', os.environ['ACTUAL_LINE'], 1); open(f, 'w').write(content)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$PROGRESS_FILE"

          if git diff --cached --quiet; then
            echo "No progress.md changes to commit."
            exit 0
          fi

          git commit -m "chore: patch progress.md with actual cost (task ${{ inputs.task_num }})"
          git push origin "$BRANCH"
